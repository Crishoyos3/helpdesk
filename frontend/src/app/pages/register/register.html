<div class="card auth-card">
  <h2>Crear cuenta</h2>

  <form (ngSubmit)="submit()">
    <label>
      Nombre
      <input
        type="text"
        name="name"
        [(ngModel)]="name"
        required
      />
    </label>

    <label>
      Email
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
      />
    </label>

    <label>
      Contraseña
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        minlength="8"
        required
      />
    </label>
    @if (error()) {
  <p class="error">{{ error() }}</p>
}

  <button type="submit" [disabled]="loading()">
  {{ loading() ? 'Registrando...' : 'Crear cuenta' }}
</button>
  </form>

  <p>
    ¿Ya tienes cuenta?
    <a routerLink="/login">Inicia sesión</a>
  </p>
</div>
